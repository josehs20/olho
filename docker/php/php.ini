; Investigação Pública — configuração PHP para o container de aplicação.
; Ajustes de produção devem ser revisados antes do deploy.

memory_limit = 256M
max_execution_time = 60
post_max_size = 16M
upload_max_filesize = 16M
date.timezone = UTC

; Cache de opcode (recomendado para FPM).
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
