# Investigação Pública — ambiente de desenvolvimento.
# Serviços: app (php-fpm), web (nginx), worker, scheduler, mysql, redis.

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: investigacao/app
  volumes:
    - .:/var/www/html
    - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
  networks:
    - osint
  restart: unless-stopped
  # Proxy de egresso do Instagram (instagrapi). O Instagram limita IPs de
  # datacenter (HTTP 429 / login_required) e vincula a sessão ao IP de origem;
  # sem um IP residencial/limpo a sessão do burner é recusada mesmo funcionando
  # no navegador. Defina INSTAGRAM_PROXY no `.env` (ex.:
  # `http://usuario:senha@host:porta` ou `socks5://...`). Vazio = sem proxy.
  # O valor é secreto (credenciais na URL) e chega ao script só pelo ambiente.
  environment:
    INSTAGRAM_PROXY: ${INSTAGRAM_PROXY:-}

services:
  app:
    <<: *app
    command: php-fpm
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - osint
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    # `--max-time`/`--max-jobs`: reciclam o processo periodicamente. Um worker de vida
    # longa pode ficar preso em estado pausado (SIGUSR2) ou com configuração lida no
    # boot já defasada, deixando a fila parada **sem qualquer log**; a reciclagem
    # devolve o consumo sozinha e faz o processo reler `.env`/código sem intervenção.
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-time=3600 --max-jobs=1000
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - osint
    ports:
      - "3306:3306" # Mapeia a porta 3306 do seu PC para a 3306 do container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - osint
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data:

networks:
  osint:
    driver: bridge
